<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BMU CAN 指令控制台 · B 方案</title>
<style>
  :root{
    --bg:#eef2f9; --panel:#ffffff; --panel2:#f8fafd; --line:#e2e8f2;
    --text:#1d2633; --muted:#7c8798; --accent:#2f6fed; --accent-soft:#e9f0ff;
    --green:#0e9f6e; --green-soft:#e5f6ef; --red:#e5484d; --red-soft:#fdeaea;
    --orange:#f29400; --orange-soft:#fdf2dd; --gray-soft:#eef1f6;
    --blue:#2f6fed; --blue-soft:#e9f0ff; --purple:#8b5cf6; --purple-soft:#f0eafd;
    --shadow:0 1px 3px rgba(20,40,80,.08),0 4px 14px rgba(20,40,80,.06);
    --shadow-sm:0 1px 2px rgba(20,40,80,.06);
    --mono:"Cascadia Code","Consolas",monospace;
  }
  .dark{
    --bg:#0d1117; --panel:#161c26; --panel2:#1b2330; --line:#263141;
    --text:#e8edf5; --muted:#8d99a8; --accent:#4c8dff; --accent-soft:#1b2a47;
    --green:#2fc48a; --green-soft:#0f2e22; --red:#f2555a; --red-soft:#3a1a1d;
    --orange:#f6b64a; --orange-soft:#32260d; --gray-soft:#222b38;
    --blue:#4c8dff; --blue-soft:#1b2a47; --purple:#a78bfa; --purple-soft:#2b2044;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       background:var(--bg);color:var(--text);font-size:13px;line-height:1.45;
       display:flex;flex-direction:column;overflow:hidden}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;gap:10px;align-items:center;padding:12px 18px;
          background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .apptitle{font-size:16px;font-weight:700;letter-spacing:.2px}
  .spacer{flex:1}
  .pill{font-size:11px;padding:3px 12px;border-radius:99px;background:var(--gray-soft);
        color:var(--muted);border:1px solid transparent;box-shadow:var(--shadow-sm);
        white-space:nowrap}
  .pill.on{background:var(--green-soft);color:var(--green);font-weight:600}
  .pill.off{background:var(--red-soft);color:var(--red);font-weight:600}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);
       border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;
       white-space:nowrap;transition:all .15s;box-shadow:var(--shadow-sm)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#4a7ff7);
               border-color:transparent;color:#fff;box-shadow:var(--shadow)}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}

  /* ---------- 主区 ---------- */
  .main{flex:1;display:grid;grid-template-columns:minmax(420px,1.15fr) 1fr;
        gap:14px;padding:14px 18px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:10px 14px;
              border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .panel-head .t{font-weight:700;font-size:13.5px}

  /* tab */
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:9px;
       cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;
       border:1px solid transparent;transition:all .15s}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--panel);color:var(--text);border-color:var(--line);
              box-shadow:var(--shadow-sm)}
  .ch-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .ch-dot.a{background:var(--blue)} .ch-dot.b{background:var(--purple)}
  .tab-count{font-size:10px;background:var(--gray-soft);color:var(--muted);
             border-radius:99px;padding:1px 7px;font-weight:600}

  /* ---------- 指令卡片 ---------- */
  .cmd-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;
            min-height:0}
  /* flex 列容器默认 flex-shrink:1，内容溢出时会把卡片压扁 —— 必须显式禁止。
     （Qt 的 QVBoxLayout 不会这样，这是 HTML 路线需要额外留意的点） */
  .cmdbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;
          box-shadow:var(--shadow-sm);overflow:hidden;transition:all .15s;cursor:pointer;
          flex-shrink:0}
  .cmdbar:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
  .cmdbar.on{background:linear-gradient(90deg,
      color-mix(in srgb,var(--accent-soft) 60%,var(--panel)) 0%,var(--panel) 55%)}
  .cmdbar.done{opacity:.72}
  .cmdbar-inner{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
  .cmd-ch{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
          justify-content:center;font-weight:800;font-size:13px;color:#fff;
          flex-shrink:0;box-shadow:var(--shadow-sm)}
  .cmd-ch.a{background:linear-gradient(135deg,#4c8dff,#2f6fed)}
  .cmd-ch.b{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
  .cmd-name{font-weight:700;font-size:13px;min-width:120px;flex:1}
  .cmd-name .sub{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:1px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;
        border-radius:99px;background:var(--gray-soft);color:var(--muted);
        white-space:nowrap;border:1px solid transparent}
  .chip b{color:var(--text);font-family:var(--mono)}
  .badge{font-size:10.5px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.err{background:var(--red-soft);color:var(--red)}
  .badge.pend{background:var(--orange-soft);color:var(--orange)}
  .badge.gray{background:var(--gray-soft);color:var(--muted)}
  .badge.run{background:var(--accent-soft);color:var(--accent)}
  .switch{position:relative;width:36px;height:19px;background:var(--gray-soft);
          border:1px solid var(--line);border-radius:99px;display:inline-block;
          flex-shrink:0;transition:all .2s;cursor:pointer}
  .switch:after{content:"";position:absolute;width:13px;height:13px;background:#fff;
          border-radius:50%;top:2px;left:3px;transition:all .2s;
          box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .switch.on{background:var(--green);border-color:transparent}
  .switch.on:after{left:19px}

  /* ---------- 监视区 ---------- */
  .filters{display:flex;gap:4px;background:var(--gray-soft);border-radius:9px;
           padding:3px;margin-left:auto}
  .fbtn{border:none;background:transparent;color:var(--muted);font-size:11px;
        padding:3px 11px;border-radius:7px;cursor:pointer;font-weight:600;transition:all .12s}
  .fbtn:hover{color:var(--text)}
  .fbtn.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
  .fbtn.on.err{color:var(--red)}
  .monitor{flex:1;overflow-y:auto;padding:10px 12px;background:var(--panel2);
           font-family:var(--mono);font-size:11.5px}
  .mline{display:flex;gap:9px;align-items:center;background:var(--panel);
         border-radius:8px;padding:5px 11px;margin-bottom:5px;
         border:1px solid var(--line);border-left-width:3px;box-shadow:var(--shadow-sm);
         animation:slidein .18s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .mline.a{border-left-color:var(--blue)}
  .mline.b{border-left-color:var(--purple)}
  .mline.err{border-left-color:var(--red);background:var(--red-soft)}
  .mline.tx{border-left-color:var(--orange)}
  .mline .ts{color:var(--muted);flex-shrink:0}
  .mline .tag{font-weight:700;flex-shrink:0;min-width:34px}
  .mline .msg{flex:1;word-break:break-all}
  .empty{color:var(--muted);text-align:center;padding:28px;font-size:12px}

  /* 滚动条 */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#c3cfdd;border-radius:5px}
  .dark ::-webkit-scrollbar-thumb{background:#3a4350}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header class="topbar">
  <div class="apptitle">BMU CAN 指令控制台</div>
  <span class="pill on" id="pillA">● CAN A 已连接</span>
  <span class="pill off" id="pillB">● CAN B 未连接</span>
  <div class="spacer"></div>
  <button class="btn primary" onclick="startAll()">▶ 启动全部</button>
  <button class="btn danger" onclick="stopAll()">⏹ 停止</button>
</header>

<div class="main">
  <section class="panel">
    <div class="panel-head">
      <span class="t">指令列表</span>
      <div class="tabs">
        <div class="tab active" data-ch="A" onclick="switchTab('A')">
          <span class="ch-dot a"></span>通道 A <span class="tab-count" id="cntA">0</span>
        </div>
        <div class="tab" data-ch="B" onclick="switchTab('B')">
          <span class="ch-dot b"></span>通道 B <span class="tab-count" id="cntB">0</span>
        </div>
      </div>
    </div>
    <div class="cmd-list" id="cmdList"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <span class="t">总线监视</span>
      <span class="chip" id="rxCount">RX <b>0</b></span>
      <div class="filters">
        <button class="fbtn on" data-f="all" onclick="setFilter('all')">全部</button>
        <button class="fbtn" data-f="tx" onclick="setFilter('tx')">发送</button>
        <button class="fbtn" data-f="rx" onclick="setFilter('rx')">接收</button>
        <button class="fbtn" data-f="err" onclick="setFilter('err')">异常</button>
      </div>
    </div>
    <div class="monitor" id="monitor">
      <div class="empty">等待总线数据…</div>
    </div>
  </section>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
var bridge = null;
var COMMANDS = [];
var activeCh = 'A';
var filter = 'all';
var monLines = 0;

new QWebChannel(qt.webChannelTransport, function (channel) {
  bridge = channel.objects.bridge;
  // 注意：JS -> Python 的方法调用拿不到返回值，
  // 数据必须由 Python 用 signal 推回来。
  bridge.commandsReady.connect(function (js) {
    try { COMMANDS = JSON.parse(js); } catch (e) { COMMANDS = []; }
    render();
    bridge.ready(COMMANDS.length);
  });
  bridge.requestCommands();
});

/* ---------------- 渲染 ---------------- */
function render() {
  var t0 = performance.now();
  var list = document.getElementById('cmdList');
  var frag = document.createDocumentFragment();
  var shownA = 0, shownB = 0;
  COMMANDS.forEach(function (c) {
    if (c.channel === 'A') shownA++; else shownB++;
  });
  document.getElementById('cntA').textContent = shownA;
  document.getElementById('cntB').textContent = shownB;

  var items = COMMANDS.filter(function (c) { return c.channel === activeCh; });
  items.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'cmdbar' + (c.enabled ? ' on' : '');
    d.setAttribute('data-name', c.name);
    var chips = c.chips.map(function (x) { return '<span class="chip">' + x + '</span>'; }).join('');
    d.innerHTML =
      '<div class="cmdbar-inner">' +
        '<div class="cmd-ch ' + c.channel.toLowerCase() + '">' + c.channel + '</div>' +
        '<div class="cmd-name">' + c.name + '<span class="sub">' + c.sub + '</span></div>' +
        chips +
        '<span class="badge ' + c.badge_cls + '">' + c.badge + '</span>' +
        '<span class="switch' + (c.enabled ? ' on' : '') + '"></span>' +
      '</div>';
    d.querySelector('.switch').addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleCmd(c.name, this);
    });
    d.addEventListener('click', function () { sendOnce(c.name); });
    frag.appendChild(d);
  });
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty">该通道暂无指令</div>';
  } else {
    list.appendChild(frag);
  }
  void list.offsetHeight;
  var ms = performance.now() - t0;
  if (bridge) bridge.report('render', ms);
  return ms;
}

function switchTab(ch) {
  activeCh = ch;
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-ch') === ch);
  });
  render();
}

function toggleCmd(name, el) {
  var t0 = performance.now();
  var on = !el.classList.contains('on');
  el.classList.toggle('on', on);
  if (bridge) bridge.report('toggle_js', performance.now() - t0);
  if (bridge) bridge.onToggle(name, on);      // JS -> Python 事件
}

function sendOnce(name) {
  if (bridge) bridge.onSendOnce(name);
  monitorAppend('tx', '→', name + ' 已发送');
}

function startAll() { if (bridge) bridge.onStartAll(); }
function stopAll() {
  document.querySelectorAll('.switch').forEach(function (s) { s.classList.remove('on'); });
  document.querySelectorAll('.cmdbar').forEach(function (c) { c.classList.remove('on'); });
  if (bridge) bridge.onStopAll();
}

/* ---------------- 监视区 ---------------- */
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-f') === f);
  });
  document.querySelectorAll('.mline').forEach(function (l) {
    var k = l.getAttribute('data-k');
    l.style.display = (f === 'all' || k === f) ? '' : 'none';
  });
}

function monitorAppend(kind, tag, msg, ts) {
  var m = document.getElementById('monitor');
  if (monLines === 0) m.innerHTML = '';
  var d = document.createElement('div');
  d.className = 'mline ' + kind;
  d.setAttribute('data-k', kind);
  if (filter !== 'all' && filter !== kind) d.style.display = 'none';
  d.innerHTML = '<span class="ts">' + (ts || '') + '</span>' +
                '<span class="tag">' + tag + '</span>' +
                '<span class="msg">' + msg + '</span>';
  m.appendChild(d);
  monLines++;
  // 只保留最近 500 行，模拟真实工具的滚动窗口
  while (m.childElementCount > 500) m.removeChild(m.firstChild);
  m.scrollTop = m.scrollHeight;
}

/* 供 Python 调用的批量入口（测吞吐用） */
function pushFrames(n, baseTs) {
  var t0 = performance.now();
  var m = document.getElementById('monitor');
  if (monLines === 0) { m.innerHTML = ''; }
  var frag = document.createDocumentFragment();
  for (var i = 0; i < n; i++) {
    var d = document.createElement('div');
    d.className = 'mline rx';
    d.setAttribute('data-k', 'rx');
    d.innerHTML = '<span class="ts">' + baseTs + '</span>' +
                  '<span class="tag">←</span>' +
                  '<span class="msg">0x1E180000  [8]  5A 5A ' +
                  ('0' + (i % 256).toString(16)).slice(-2) + ' DE AD BE EF 00 25 25</span>';
    frag.appendChild(d);
    monLines++;
  }
  m.appendChild(frag);
  while (m.childElementCount > 500) m.removeChild(m.firstChild);
  m.scrollTop = m.scrollHeight;
  void m.offsetHeight;
  var ms = performance.now() - t0;
  if (bridge) bridge.report('pushFrames', ms);
  return ms;
}

function updateCounter(n) {
  document.getElementById('rxCount').innerHTML = 'RX <b>' + n + '</b>';
}

/* ---------------- 效率测试专用入口 ---------------- */

/* 逐帧推送：每次调用追加一行，第 target 次时回报总耗时 */
var __t0 = 0, __target = 0, __got = 0;
function burstBegin(n) { __target = n; __got = 0; __t0 = performance.now(); }

function appendOne(i) {
  var m = document.getElementById('monitor');
  if (monLines === 0) m.innerHTML = '';
  var d = document.createElement('div');
  d.className = 'mline rx';
  d.setAttribute('data-k', 'rx');
  d.innerHTML = '<span class="ts">18:39:02.' + (100 + (i % 900)) + '</span>' +
                '<span class="tag">←</span>' +
                '<span class="msg">0x1E180000  [8]  5A 5A ' +
                ('0' + (i % 256).toString(16)).slice(-2) + ' DE AD BE EF 00 25 25</span>';
  m.appendChild(d);
  monLines++;
  while (m.childElementCount > 500) m.removeChild(m.firstChild);
  m.scrollTop = m.scrollHeight;
  __got++;
  if (__got >= __target && bridge) bridge.report('calls', performance.now() - __t0);
}

/* JS -> Python 事件吞吐：连续 n 次调用 Python 槽 */
function pingPy(n) { for (var i = 0; i < n; i++) { if (bridge) bridge.ping(); } }

function setDark(on) {
  document.body.classList.toggle('dark', !!on);
}
</script>
</body>
</html>
