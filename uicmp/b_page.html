<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>B · QWebEngine 还原 v3 mockup</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
/* ============================================================
   CSS 直接取自 docs/ui_mockup/ui_mockup_v3.html（几乎逐字）
   唯一改动：.cmdbar.running-on 里的 color-mix() 换成预置色值
   —— Qt 5.15 的 QWebEngine 是 Chromium 83（2020-07），不支持 color-mix。
   ============================================================ */
:root{
  --bg:#eef2f9; --panel:#ffffff; --panel2:#f8fafd; --line:#e2e8f2;
  --text:#1d2633; --muted:#7c8798; --accent:#2f6fed; --accent-soft:#e9f0ff;
  --green:#0e9f6e; --green-soft:#e5f6ef; --blue:#2f6fed; --blue-soft:#e9f0ff;
  --purple:#8b5cf6; --purple-soft:#f0eafd;
  --gray-busy:#5b6b7b; --gray-busy-soft:#e8edf3;
  --red:#e5484d; --red-soft:#fdeaea;
  --shadow:0 1px 3px rgba(20,40,80,.08),0 4px 14px rgba(20,40,80,.06);
  --shadow-sm:0 1px 2px rgba(20,40,80,.06);
  --mono:"Cascadia Code","Consolas",monospace;
  --run-grad-start:#f4f8ff;   /* 取代 color-mix(blue-soft 55%, panel) */
}
.dark{
  --bg:#0d1117; --panel:#161c26; --panel2:#1b2330; --line:#263141;
  --text:#e8edf5; --muted:#8d99a8; --accent:#4c8dff; --accent-soft:#1b2a47;
  --green:#2fc48a; --green-soft:#0f2e22; --blue:#4c8dff; --blue-soft:#1b2a47;
  --purple:#a78bfa; --purple-soft:#2b2044;
  --gray-busy:#9fb0bf; --gray-busy-soft:#252e3a;
  --red:#f2555a; --red-soft:#3a1a1d;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --run-grad-start:#1a2432;   /* 深色下的等效色 */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45;padding:18px;overflow-x:hidden}
.hint{color:var(--muted);font-size:11px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.apptitle{font-size:17px;font-weight:700;letter-spacing:.2px}
.spacer{flex:1}
.pill{font-size:11px;padding:3px 12px;border-radius:99px;background:var(--panel);color:var(--muted);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--blue),#4a7ff7);border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn.sm{padding:3px 10px;font-size:11px;border-radius:6px}
.btn.ghost{border-style:dashed;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.panel-head .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
/* ---------- 顶部总线 A/B 控制条 ---------- */
.bus-bar{display:flex;gap:14px;align-items:stretch;padding:10px 16px;background:var(--panel);flex-wrap:wrap}
.bus-card{flex:1 1 240px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel2);box-shadow:var(--shadow-sm)}
.bus-ch{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.bus-ch.a{background:linear-gradient(135deg,#4c8dff,#2f6fed)}
.bus-ch.b{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.bus-name{font-weight:700;font-size:14px}
.bus-name .st{font-size:10.5px;font-weight:600;margin-left:6px}
.st.open{color:var(--green)} .st.closed{color:var(--gray-busy)} .st.err{color:var(--red)}
.bus-stat{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:2px}
.bus-stat b{color:var(--text);font-family:var(--mono);font-weight:700}
.bus-btn{margin-left:auto;display:flex;gap:6px;align-items:center}
.switch{position:relative;width:34px;height:18px;background:var(--gray-busy-soft);border:1px solid var(--line);border-radius:99px;display:inline-block;flex-shrink:0;transition:all .2s;cursor:pointer;vertical-align:middle}
.switch:after{content:"";position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:2px;left:3px;transition:all .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--green);border-color:transparent}
.switch.on:after{left:18px}
/* ---------- 指令条（气泡） ---------- */
.tabs{display:flex;gap:6px;padding:12px 16px 0;background:var(--panel2);border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;padding:10px 22px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;background:transparent;border:1px solid transparent;border-bottom:none;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:0 -3px 8px rgba(20,40,80,.03);position:relative;top:1px}
.ch-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ch-dot.a{background:var(--blue)} .ch-dot.b{background:var(--purple)}
.tab-count{font-size:10px;background:var(--gray-busy-soft);color:var(--muted);border-radius:99px;padding:1px 8px;font-weight:600}
.tabbody{display:none;padding:14px 16px 16px}
.tabbody.active{display:block}
.edit-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.edit-tools .hint{margin-left:auto}
.cmdbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);margin-bottom:10px;overflow:hidden;transition:all .15s;cursor:pointer;position:relative}
.cmdbar:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
/* ⚠️ 原 v3 此处为 color-mix(in srgb,var(--blue-soft) 55%,var(--panel))，Chromium 83 不支持 */
.cmdbar.running-on{background:linear-gradient(90deg,var(--run-grad-start) 0%,var(--panel) 60%)}
.cmdbar.locked{opacity:.92}
.cmdbar.done{opacity:.8;filter:saturate(.85)}
.cmdbar-inner{display:flex;align-items:center;gap:12px;padding:11px 16px;flex-wrap:wrap}
.cmd-ch{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;box-shadow:var(--shadow-sm)}
.cmd-ch.a{background:linear-gradient(135deg,#4c8dff,#2f6fed)}
.cmd-ch.b{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.cmd-name{font-weight:700;font-size:13.5px;min-width:130px;flex:1}
.cmd-name .sub{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:1px}
.cmd-name .sub b{color:var(--blue);font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 11px;border-radius:99px;background:var(--gray-busy-soft);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip b{color:var(--text);font-family:var(--mono)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.purple{background:var(--purple-soft);color:var(--purple)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.gray{background:var(--gray-busy-soft);color:var(--muted)}
.chip.editable{background:var(--panel);border:1px dashed var(--blue);cursor:text;position:relative}
.chip.cmd-ctl{cursor:pointer;border:1px dashed transparent;transition:all .1s}
.chip.cmd-ctl:hover{border-color:var(--blue)}
.badge{font-size:10.5px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.run{background:var(--blue-soft);color:var(--blue)}
.badge.busy{background:var(--gray-busy-soft);color:var(--gray-busy)}
.badge.err{background:var(--red-soft);color:var(--red)}
.badge.gray{background:var(--gray-busy-soft);color:var(--muted)}
.chev{color:var(--muted);font-size:11px;transition:transform .2s;user-select:none;flex-shrink:0}
.cmdbar.open .chev{transform:rotate(180deg)}
.cmd-detail{display:none;padding:2px 16px 14px 64px}
.cmdbar.open .cmd-detail{display:block}
.detail-wrap{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.dframe{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:8px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
.dframe:hover{background:var(--panel)}
.dframe .seq{color:var(--muted);min-width:24px}
.dframe .id{font-weight:700;min-width:110px}
.dframe .id.a{color:var(--blue)}
.dframe .id.b{color:var(--purple)}
.dframe .data{color:var(--muted);letter-spacing:.3px;flex:1;min-width:160px}
.dframe .badge{margin-left:auto}
.empty-zone{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;font-size:12px;background:var(--panel2)}
/* ---------- 监视区 ---------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fgroup{display:flex;gap:4px;background:var(--gray-busy-soft);border-radius:10px;padding:3px;border:1px solid var(--line)}
.fbtn{border:none;background:transparent;color:var(--muted);font-size:11px;padding:4px 12px;border-radius:8px;cursor:pointer;font-weight:600;transition:all .12s}
.fbtn:hover{color:var(--text)}
.fbtn.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
.fbtn.on.a{color:var(--blue)} .fbtn.on.b{color:var(--purple)}
.fbtn.on.tx{color:var(--blue)} .fbtn.on.rx{color:var(--green)} .fbtn.on.err{color:var(--red)}
.monitor{overflow:auto;max-height:320px;padding:12px 14px;background:var(--panel2)}
.mline{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 12px;margin-bottom:6px;border:1px solid var(--line);border-left-width:4px;box-shadow:var(--shadow-sm);font-family:var(--mono);font-size:11.5px;flex-wrap:wrap;transition:all .12s}
.mline:hover{box-shadow:var(--shadow)}
.mline.a{border-left-color:var(--blue)}
.mline.b{border-left-color:var(--purple)}
.m-time{color:var(--muted);min-width:84px}
.m-ch{font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;color:#fff}
.m-ch.a{background:var(--blue)} .m-ch.b{background:var(--purple)}
.m-ch.sys{background:var(--gray-busy)}
.m-dir{font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;letter-spacing:.5px}
.m-dir.tx{background:var(--blue-soft);color:var(--blue)}
.m-dir.rx{background:var(--green-soft);color:var(--green)}
.m-dir.err{background:var(--red-soft);color:var(--red)}
.m-dir.sys{background:var(--gray-busy-soft);color:var(--gray-busy)}
.m-fno{color:var(--muted);font-size:10px}
.m-id{font-weight:700}
.m-data{color:var(--muted);flex:1;text-align:right;letter-spacing:.2px}
.mline.tx .m-id{color:var(--text)}
.mline.rx .m-id{color:var(--green)}
.mline.err .m-id,.mline.err .m-data{color:var(--red)}
/* 右键菜单 */
.ctx{display:none;position:fixed;z-index:99;min-width:170px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;font-size:12px}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--text);white-space:nowrap}
.ctx-item:hover{background:var(--blue-soft);color:var(--blue)}
.ctx-item.danger:hover{background:var(--red-soft);color:var(--red)}
.ctx-sep{height:1px;background:var(--line);margin:4px 6px}
/* 统计 */
.bottombar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.stat{display:flex;gap:6px;flex-wrap:wrap}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:12px;box-shadow:var(--shadow-sm);display:flex;gap:12px;align-items:center}
.scard .n{font-size:17px;font-weight:800;font-family:var(--mono)}
.scard .k{font-size:10px;color:var(--muted)}
.scard .n.g{color:var(--green)} .scard .n.r{color:var(--red)} .scard .n.bl{color:var(--blue)} .scard .n.pu{color:var(--purple)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.i-a{background:var(--blue)} .i-b{background:var(--purple)} .i-tx{background:var(--blue)} .i-rx{background:var(--green)} .i-err{background:var(--red)}
.lockveil{display:none;padding:8px 16px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:600;text-align:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 18px;font-size:12px;color:var(--text);display:none;z-index:120}
</style>
</head>
<body>

<div class="topbar">
  <span class="apptitle">CAN 多指令定时发送</span>
  <span class="pill" id="casePill">用例加载中…</span>
  <span class="spacer"></span>
  <button class="btn sm ghost" onclick="notImpl('导入 JSON')">导入 JSON</button>
  <button class="btn sm ghost" onclick="notImpl('导入 Excel')">导入 Excel</button>
  <button class="btn sm ghost" onclick="notImpl('导出配置')">导出配置</button>
  <button class="btn sm primary" id="btnToggleRun" onclick="toggleRun()">▶ 开始发送（锁定配置）</button>
  <button class="btn sm" onclick="toggleTheme()">🌙 深色</button>
</div>

<!-- ============ 总线开关置顶 ============ -->
<div class="panel">
  <div class="bus-bar" id="busBar"></div>
</div>

<!-- ============ 指令配置 ============ -->
<div class="panel" id="cfgPanel">
  <div class="panel-head">
    <span class="t">指令配置</span>
    <span class="hint">双击展开帧 · 右键单发/更多 · 相同指令可配不同 ID</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="lockveil" id="lockVeil">🔒 运行中 — 指令配置已锁定（只读）。可右键单条单发或查看；停止后恢复编辑。</div>
  <div id="tabHost"></div>
</div>

<!-- ============ 监视区 ============ -->
<div class="panel">
  <div class="panel-head">
    <span class="t">收发监视流 <span style="font-weight:400;color:var(--muted);font-size:11px">· 每帧一条气泡 · 最新在上</span></span>
    <span class="spacer"></span>
    <div class="filters">
      <div class="fgroup" id="fgChan">
        <button class="fbtn on a" data-f="A" onclick="toggleFilter('chan','A',this)">通道 A</button>
        <button class="fbtn on b" data-f="B" onclick="toggleFilter('chan','B',this)">通道 B</button>
      </div>
      <div class="fgroup" id="fgDir">
        <button class="fbtn on tx" data-f="TX" onclick="toggleFilter('dir','TX',this)">TX</button>
        <button class="fbtn on rx" data-f="RX" onclick="toggleFilter('dir','RX',this)">RX</button>
        <button class="fbtn on err" data-f="ERR" onclick="toggleFilter('dir','ERR',this)">ERR</button>
      </div>
      <button class="btn sm" id="btnPause" onclick="togglePause()">暂停</button>
      <button class="btn sm" onclick="clearMonitor()">清空</button>
      <button class="btn sm primary" onclick="notImpl('导出记录')">导出记录</button>
    </div>
  </div>
  <div class="monitor" id="monitor"></div>
</div>

<div class="bottombar">
  <div class="stat" id="statBar"></div>
  <span class="spacer"></span>
  <div class="legend">
    <span class="lg"><i class="i-a"></i>通道 A</span>
    <span class="lg"><i class="i-b"></i>通道 B</span>
    <span class="lg"><i class="i-tx"></i>发送/运行</span>
    <span class="lg"><i class="i-rx"></i>接收/成功</span>
    <span class="lg"><i class="i-err"></i>错误/失败</span>
  </div>
</div>

<div class="ctx" id="ctxMenu">
  <div class="ctx-item" onclick="ctxAct('sendOnce')">▶ 立即发送一次</div>
  <div class="ctx-item" onclick="ctxAct('enableTimer')">⏱ 启用定时发送</div>
  <div class="ctx-item" onclick="ctxAct('stopTimer')">⏹ 停止定时发送</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="ctxAct('copy')">📋 复制指令</div>
  <div class="ctx-item" onclick="ctxAct('editFrames')">✎ 编辑帧 / 修改 ID</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" onclick="ctxAct('delete')">🗑 删除指令</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   状态。数据全部由 Python 推过来；JS 只发"意图"，不取数据。
   铁律①：QWebChannel 里 JS → Python 的调用拿不到返回值。
   ============================================================ */
var bridge = null;
var S = {
  note: '',
  bus: { A: {open:false, baud:'500K', tx:0, rx:0, err:0, note:'未连接'},
         B: {open:false, baud:'500K', tx:0, rx:0, err:0, note:'未连接'} },
  cmds: { A: [], B: [] },
  stats: { txA:0, txB:0, rx:0, busy:0, err:0 }
};
var tab = 'A';
var running = false;
var paused = false;
var filt = { chan:{A:true,B:true}, dir:{TX:true,RX:true,ERR:true} };
var monitor = [];
var openSet = {};
var sel = { A:-1, B:-1 };
var ctxIdx = -1;
var MAXMON = 300;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hexId(v){ return '0x' + Number(v).toString(16).toUpperCase(); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(function(){ t.style.display='none'; },2200); }
function notImpl(name){ toast(name + ' · 本对比只做最小交互，这一项未接入'); }

/* ---------------- 总线卡片 ---------------- */
function renderBus(){
  var h = '';
  ['A','B'].forEach(function(ch){
    var b = S.bus[ch];
    var stCls = b.open ? 'open' : 'closed';
    h += '<div class="bus-card">';
    h += '<span class="bus-ch ' + ch.toLowerCase() + '">' + ch + '</span>';
    h += '<div style="flex:1;min-width:0">';
    h += '<div class="bus-name">通道 ' + ch + ' <span class="st ' + stCls + '">' +
         (b.open ? '● 已开启' : '○ 已关闭') + '</span></div>';
    h += '<div class="bus-stat">';
    h += '<span>波特率 <b>' + b.baud + '</b></span>';
    h += '<span>TX <b class="' + (ch==='A'?'bl':'pu') + '">' + b.tx + '</b></span>';
    h += '<span>RX <b class="g">' + b.rx + '</b></span>';
    h += '<span>错误 <b class="r">' + b.err + '</b></span>';
    h += '</div>';
    if (b.note) h += '<div class="hint" style="margin-top:2px">' + esc(b.note) + '</div>';
    h += '</div>';
    h += '<span class="bus-btn">';
    h += '<button class="btn sm" onclick="toggleBus(\'' + ch + '\')">' +
         (b.open ? '关闭设备' : '打开设备') + '</button>';
    h += '<span class="switch' + (b.open ? ' on' : '') + '" onclick="toggleBus(\'' + ch + '\')"></span>';
    h += '</span></div>';
  });
  document.getElementById('busBar').innerHTML = h;
  document.getElementById('casePill').textContent = S.note || '就绪';
}

/* ---------------- Tab ---------------- */
function renderTabs(){
  var h = '';
  ['A','B'].forEach(function(ch){
    h += '<div class="tab' + (tab===ch?' active':'') + '" onclick="switchTab(\'' + ch + '\')">';
    h += '<span class="ch-dot ' + ch.toLowerCase() + '"></span>通道 ' + ch;
    h += ' <span class="tab-count">' + S.cmds[ch].length + ' 条</span></div>';
  });
  document.getElementById('tabs').innerHTML = h;
}

/* ---------------- 指令卡 ---------------- */
function renderTab(){
  var ch = tab, list = S.cmds[ch];
  var h = '';
  h += '<div class="tabbody active" id="tab' + ch + '">';
  h += '<div class="edit-tools">';
  h += '<button class="btn sm" onclick="addCmd()">＋ 添加指令</button>';
  h += '<button class="btn sm" onclick="copyCmd()">复制选中</button>';
  h += '<button class="btn sm danger" onclick="delCmd()">删除</button>';
  h += '<button class="btn sm" onclick="moveCmd(-1)">↑</button>';
  h += '<button class="btn sm" onclick="moveCmd(1)">↓</button>';
  h += '<span class="chip cmd-ctl" onclick="notImpl(\'预设库\')">预设 ▼ STAR_WGS84</span>';
  h += '<span class="hint">间隔 ≥10ms · 双击行展开 · 右键更多</span>';
  h += '</div>';

  if (!list.length){
    h += '<div class="empty-zone">这个通道还没有指令 —— 点「＋ 添加指令」</div>';
    h += '</div>';
    document.getElementById('tabHost').innerHTML = h;
    return;
  }

  list.forEach(function(c, i){
    var key = ch + '-' + i;
    var isOpen = !!openSet[key];
    var isSel = sel[ch] === i;
    var cls = 'cmdbar' + (isOpen ? ' open' : '') + (c.enabled && running ? ' running-on' : '');
    h += '<div class="' + cls + '" ondblclick="expandCmd(' + i + ')" oncontextmenu="openCtx(event,' + i + ');return false;"' +
         (isSel ? ' style="border-color:var(--accent);box-shadow:var(--shadow)"' : '') + '>';
    h += '<div class="cmdbar-inner">';
    h += '<span class="cmd-ch ' + ch.toLowerCase() + '">' + ch + '</span>';
    h += '<span class="cmd-name">' + esc(c.name);
    h += '<span class="sub">' + esc(c.sub || '') + ' · 帧1 ID <b>' + hexId(c.frames[0].id) + '</b></span></span>';
    h += '<span class="chip blue">' + c.frames.length + ' 帧</span>';
    h += '<span class="chip editable" onclick="event.stopPropagation();notImpl(\'修改间隔\')">⏱ <b>' + c.interval_ms + '</b> ms</span>';
    h += '<span class="chip gray">⇉ <b>' + c.count + '</b></span>';
    if (c.state) h += '<span class="chip ' + c.stateKind + '">' + esc(c.state) + '</span>';
    if (c.enabled) h += '<span class="badge run" style="margin-left:auto">运行中</span>';
    else h += '<span class="badge gray" style="margin-left:auto">停止</span>';
    h += '<span class="switch' + (c.enabled ? ' on' : '') + '" onclick="event.stopPropagation();toggleCmd(' + i + ')"></span>';
    h += '<span class="chev" onclick="event.stopPropagation();expandCmd(' + i + ')">▾</span>';
    h += '</div>';
    h += '<div class="cmd-detail"><div class="detail-wrap">';
    c.frames.forEach(function(f, k){
      h += '<div class="dframe"><span class="seq">#' + (k+1) + '</span>' +
           '<span class="id ' + ch.toLowerCase() + '">' + hexId(f.id) + '</span>' +
           '<span class="data">' + esc(f.data) + '</span>' +
           (f.badge ? '<span class="badge ' + f.badgeKind + '">' + esc(f.badge) + '</span>' : '') +
           '</div>';
    });
    h += '</div></div></div>';
  });
  h += '</div>';
  document.getElementById('tabHost').innerHTML = h;
  document.getElementById('lockVeil').style.display = running ? 'block' : 'none';
}

/* ---------------- 监视区 ---------------- */
function renderMonitor(){
  var h = '';
  for (var i = monitor.length - 1; i >= 0; i--){
    var m = monitor[i];
    if (m.ch !== 'SYSTEM'){
      if (!filt.chan[m.ch]) continue;
      if (!filt.dir[m.dir]) continue;
    }
    h += '<div class="mline ' + (m.ch==='SYSTEM' ? '' : m.ch.toLowerCase()) + ' ' + m.dir.toLowerCase() + '">';
    h += '<span class="m-time">' + m.time + '</span>';
    h += '<span class="m-ch ' + (m.ch==='SYSTEM' ? 'sys' : m.ch.toLowerCase()) + '">' + m.ch + '</span>';
    h += '<span class="m-dir ' + m.dir.toLowerCase() + '">' + (m.dir==='SYS'?'SYS':m.dir) + '</span>';
    if (m.fno) h += '<span class="m-fno">' + esc(m.fno) + '</span>';
    if (m.id) h += '<span class="m-id">' + m.id + '</span>';
    h += '<span class="m-data">' + esc(m.data || '') + '</span>';
    h += '</div>';
  }
  if (!h) h = '<div class="empty-zone">还没有收发记录</div>';
  var box = document.getElementById('monitor');
  box.innerHTML = h;
  box.scrollTop = 0;   /* 最新在上 */
}

/* ---------------- 统计卡 ---------------- */
function renderStats(){
  var s = S.stats;
  var h = '';
  h += '<div class="scard"><div><div class="n bl">' + s.txA + '</div><div class="k">TX · A</div></div></div>';
  h += '<div class="scard"><div><div class="n pu">' + s.txB + '</div><div class="k">TX · B</div></div></div>';
  h += '<div class="scard"><div><div class="n g">' + s.rx + '</div><div class="k">RX 总数</div></div></div>';
  h += '<div class="scard"><div><div class="n bl">' + s.busy + '</div><div class="k">应答中</div></div></div>';
  h += '<div class="scard"><div><div class="n r">' + s.err + '</div><div class="k">发送错误</div></div></div>';
  document.getElementById('statBar').innerHTML = h;
}

function renderAll(){ renderBus(); renderTabs(); renderTab(); renderMonitor(); renderStats(); }

/* ============================================================
   交互 —— 只发意图给 Python
   ============================================================ */
function switchTab(ch){ tab = ch; renderTabs(); renderTab(); }
function toggleBus(ch){ if (bridge) bridge.toggleBus(ch); }
function toggleCmd(i){ if (bridge) bridge.toggleCmd(tab, i); }
function addCmd(){ if (bridge) bridge.addCmd(tab); }
function delCmd(){
  if (sel[tab] < 0){ toast('先点选一条指令（单击卡片）'); return; }
  if (bridge) bridge.delCmd(tab, sel[tab]);
}
function copyCmd(){
  if (sel[tab] < 0){ toast('先点选一条指令（单击卡片）'); return; }
  if (bridge) bridge.copyCmd(tab, sel[tab]);
}
function moveCmd(d){
  if (sel[tab] < 0){ toast('先点选一条指令'); return; }
  if (bridge) bridge.moveCmd(tab, sel[tab], d);
}
function sendOnce(i){ if (bridge) bridge.sendOnce(tab, i); }
function expandCmd(i){ var k = tab + '-' + i; openSet[k] = !openSet[k]; renderTab(); }
function selectCmd(i){
  /* 单击选中（双击/开关/chevron 不会走到这，它们各自 stopPropagation） */
  sel[tab] = i; renderTab();
}
function toggleRun(){
  running = !running;
  var b = document.getElementById('btnToggleRun');
  b.textContent = running ? '⏹ 停止（解锁）' : '▶ 开始发送（锁定配置）';
  document.getElementById('lockVeil').style.display = running ? 'block' : 'none';
  if (bridge) bridge.setRun(running);
  renderTab();
}
function toggleTheme(){ if (bridge) bridge.toggleTheme(); }
function setDark(d){
  document.body.className = d ? 'dark' : '';
  var b = document.querySelector('.topbar .btn:last-child');
  if (b) b.textContent = d ? '☀ 浅色' : '🌙 深色';
}
function clearMonitor(){ monitor = []; renderMonitor(); }
function togglePause(){
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '继续' : '暂停';
  if (bridge) bridge.setPause(paused);
}
function toggleFilter(group, val, btn){
  btn.classList.toggle('on');
  filt[group][val] = btn.classList.contains('on');
  renderMonitor();
}

/* ---------------- 右键菜单 ---------------- */
function openCtx(e, i){
  ctxIdx = i; sel[tab] = i;
  var m = document.getElementById('ctxMenu');
  m.style.display = 'block';
  m.style.left = Math.min(e.clientX, window.innerWidth - 190) + 'px';
  m.style.top = Math.min(e.clientY, window.innerHeight - 230) + 'px';
  renderTab();
}
function ctxAct(act){
  document.getElementById('ctxMenu').style.display = 'none';
  var i = ctxIdx;
  if (i < 0) return;
  if (act === 'sendOnce') sendOnce(i);
  else if (act === 'enableTimer') { if (bridge) bridge.setCmdEnabled(tab, i, true); }
  else if (act === 'stopTimer')   { if (bridge) bridge.setCmdEnabled(tab, i, false); }
  else if (act === 'copy')        { if (bridge) bridge.copyCmd(tab, i); }
  else if (act === 'editFrames')  notImpl('编辑帧 / 修改 ID');
  else if (act === 'delete')      { sel[tab] = i; delCmd(); }
}
document.addEventListener('click', function(){
  document.getElementById('ctxMenu').style.display = 'none';
});
document.addEventListener('mousedown', function(e){
  /* 单击 = 选中。跳过卡片内部会 stopPropagation 的控件 */
  var bar = e.target.closest ? e.target.closest('.cmdbar') : null;
  if (bar) {
    var host = bar.parentNode;
    var idx = Array.prototype.indexOf.call(host.children, bar);
    if (idx >= 0) selectCmd(idx);
  }
}, true);

/* ============================================================
   以下由 Python 通过 runJavaScript 调用
   ============================================================ */
function onInit(json){
  var d = JSON.parse(json);
  S.note = d.note || '';
  if (d.bus) S.bus = d.bus;
  if (d.cmds) S.cmds = d.cmds;
  if (d.stats) S.stats = d.stats;
  renderAll();
}
function onCmds(json){
  var d = JSON.parse(json);
  S.cmds = d.cmds;
  if (d.stats) S.stats = d.stats;
  renderTabs(); renderTab(); renderStats();
}
function onBus(ch, open, note){
  var b = S.bus[ch];
  b.open = !!open; b.note = note || '';
  renderBus();
}
function onStat(json){
  S.stats = JSON.parse(json);
  renderStats();
}
function onBusCount(ch, tx, rx, err){
  var b = S.bus[ch];
  b.tx = tx; b.rx = rx; b.err = err;
  renderBus();
}
function onLine(json){
  if (paused) return;
  var m = JSON.parse(json);
  monitor.push(m);
  if (monitor.length > MAXMON) monitor.shift();
  renderMonitor();
}
function onTxMark(ch, idx, ok){
  var c = S.cmds[ch] && S.cmds[ch][idx];
  if (!c) return;
  c.state = ok ? '最近成功' : 'TX 失败';
  c.stateKind = ok ? 'green' : 'red';
  var st = (S.stats);
  if (ok) { if (ch==='A') st.txA++; else st.txB++; } else { st.err++; }
  renderTab(); renderStats();
}
function onFrameMark(ch, idx, k, ok){
  var c = S.cmds[ch] && S.cmds[ch][idx];
  if (!c || !c.frames[k]) return;
  c.frames[k].badge = ok ? 'OK' : 'TX 失败';
  c.frames[k].badgeKind = ok ? 'ok' : 'err';
  renderTab();
}

/* ---------------- 启动 ---------------- */
function boot(){
  if (typeof QWebChannel === 'undefined'){ toast('QWebChannel 未注入'); return; }
  new QWebChannel(qt.webChannelTransport, function(channel){
    bridge = channel.objects.bridge;
    /* 铁律①：这里只能"发请求"，拿不到返回值 —— Python 会回推 onInit() */
    bridge.ready();
  });
}
window.onload = boot;
</script>
</body>
</html>
